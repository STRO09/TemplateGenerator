    <script>
      (function () {
        "use strict";

        /* ---------------------------------------------------
         ELEMENTS
      --------------------------------------------------- */

        const glitchElement = document.getElementById("glitchText");
        const glowElement = document.getElementById("glowText");
        const stageElement = document.querySelector(".lang-selection__stage");

        const pickerElement = document.getElementById("languagePicker");
        const triggerElement = document.getElementById("languageTrigger");
        const valueElement = document.getElementById("languageTriggerValue");

        const listElement = document.getElementById("languageList");

        const optionElements = Array.from(
          listElement.querySelectorAll(".language-picker__option"),
        );

        /* ---------------------------------------------------
         CONSTANTS / STATE
      --------------------------------------------------- */

        const ICON_BASE = "https://cdn.simpleicons.org/";
        const ICON_TINT = "dfbfbf";

        let currentLanguage = "Java";
        let pendingSelection = null;
        let isGlitching = false;

        /* ---------------------------------------------------
         DROPDOWN OPEN / CLOSE
      --------------------------------------------------- */

        function isListOpen() {
          return pickerElement.classList.contains("is-open");
        }

        function openList() {
          pickerElement.classList.add("is-open");
          triggerElement.setAttribute("aria-expanded", "true");
        }

        function closeList() {
          pickerElement.classList.remove("is-open");
          triggerElement.setAttribute("aria-expanded", "false");
        }

        triggerElement.addEventListener("click", function (event) {
          event.stopPropagation();
          isListOpen() ? closeList() : openList();
        });

        triggerElement.addEventListener("keydown", function (event) {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            openList();

            const activeOption =
              optionElements.find(function (option) {
                return option.getAttribute("aria-selected") === "true";
              }) || optionElements[0];

            activeOption.focus();
          }
        });

        /* click outside -> close */
        document.addEventListener("click", function (event) {
          if (!pickerElement.contains(event.target)) {
            closeList();
          }
        });

        /* escape -> close */
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && isListOpen()) {
            closeList();
            triggerElement.focus();
          }
        });

        /* ---------------------------------------------------
         OPTION INTERACTION
      --------------------------------------------------- */

        optionElements.forEach(function (option, index) {
          option.addEventListener("click", function () {
            chooseLanguage(option);
          });

          option.addEventListener("keydown", function (event) {
            if (event.key === "ArrowDown") {
              event.preventDefault();
              optionElements[(index + 1) % optionElements.length].focus();
            } else if (event.key === "ArrowUp") {
              event.preventDefault();
              optionElements[
                (index - 1 + optionElements.length) % optionElements.length
              ].focus();
            } else if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              chooseLanguage(option);
            } else if (event.key === "Tab") {
              closeList();
            }
          });
        });

        /* ---------------------------------------------------
         LANGUAGE CHANGE  ->  GLITCH  ->  SWAP TEXT
      --------------------------------------------------- */

        function chooseLanguage(option) {
          closeList();
          triggerElement.focus();

          const language = option.dataset.value;
          const icon = option.dataset.icon;

          /* picking the language that is already active cancels
           any in-flight change and does nothing else */
          if (language === currentLanguage) {
            pendingSelection = null;
            return;
          }

          pendingSelection = { language: language, icon: icon };

          /* a glitch is already running: the latest pick wins,
           it will be applied when the animation ends */
          if (isGlitching) {
            return;
          }

          isGlitching = true;
          document.body.classList.add("glitching");

          glitchElement.addEventListener("animationend", handleGlitchEnd);
        }

        function handleGlitchEnd(event) {
          /* the ::before / ::after ghosts fire their own
           animationend events - ignore those */
          if (event.pseudoElement) {
            return;
          }

          glitchElement.removeEventListener("animationend", handleGlitchEnd);

          if (pendingSelection) {
            applySelection();
          }

          document.body.classList.remove("glitching");
          isGlitching = false;
        }

        function applySelection() {
          const language = pendingSelection.language;
          const icon = pendingSelection.icon;

          pendingSelection = null;
          currentLanguage = language;

          /* 1. visible text */
          glitchElement.textContent = language;

          /* 2. text used by ::before / ::after */
          glitchElement.dataset.text = language;

          /* 3. glow layer */
          glowElement.textContent = language;

          /* 4. dropdown trigger */
          valueElement.textContent = language;

          /* 5. dropdown option states */
          optionElements.forEach(function (option) {
            option.setAttribute(
              "aria-selected",
              String(option.dataset.value === language),
            );
          });

          /* 6. keep the display type inside the column */
          stageElement.style.setProperty(
            "--lang-chars",
            String(language.length),
          );
        }

        /* ---------------------------------------------------
         ICONS
      --------------------------------------------------- */

        if (window.lucide) {
          window.lucide.createIcons();
        }
      })();
    </script>
